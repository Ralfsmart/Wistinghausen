  <path d="M562 194 Q560 225 548 256"/>
  <path d="M620 240 Q600 330 560 420 Q535 490 528 560"/>
</g>

<!-- Hauptstraße: B31-Ausfahrt -> Bahnhofstraße -> Mühlhofen -> Salem -->
<path id="bahnhofstr" d="M215 268 Q300 300 360 286 Q430 300 470 285 Q545 255 615 235 Q700 160 800 70" fill="none" stroke="#B7A28C" stroke-width="12" stroke-linecap="round"/>
