<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 560" role="img" aria-labelledby="t d">
<title id="t">Anfahrtsskizze Schreinerei Wistinghausen</title>
<desc id="d">Vereinfachte Skizze: Von der B31 Ausfahrt Uhldingen-Mühlhofen über die Bahnhofstraße nach Mühlhofen, Untere Weitfeld Straße 14.</desc>
<defs>
  <filter id="schatten" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3E2A1E" flood-opacity=".35"/></filter>
  <clipPath id="rund"><circle cx="0" cy="0" r="27"/></clipPath>
</defs>
<style>
