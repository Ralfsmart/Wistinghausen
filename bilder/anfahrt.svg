  .str{font:italic 13px 'Source Sans 3',Arial,sans-serif;fill:#7A4E2D}
  .ziel{font:600 14px 'Source Sans 3',Arial,sans-serif;fill:#7A4E2D}
  .klein{font:12px 'Source Sans 3',Arial,sans-serif;fill:#9A8070}
  .titel{font:600 16px 'Source Serif 4',Georgia,serif;fill:#7B3F22}
  .adr{font:14px 'Source Sans 3',Arial,sans-serif;fill:#5C3A21}
</style>

