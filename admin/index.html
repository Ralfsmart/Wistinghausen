<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin – Schreinerei Wistinghausen</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../css/style.css?v=13">
<link rel="stylesheet" href="admin.css?v=13">
<script src="config.js?v=13" defer></script>
<script src="admin.js?v=13" defer></script>
</head>
<body class="admin">

<header class="a-top wood">
  <div class="a-top-in">
    <b>Website bearbeiten</b>
    <span class="a-status" id="status" role="status" aria-live="polite"></span>
    <a href="../index.html" target="_blank" rel="noopener">Website ansehen ↗</a>
    <button type="button" id="abmelden" hidden>Abmelden</button>
  </div>
</header>

<!-- Anmeldung -->
<section class="a-login" id="login">
  <h1>Anmelden</h1>
  <form id="login-form">
    <label>Speicherort
      <select id="speicherort"></select>
    </label>

    <div data-fuer="github">
      <label>Zugangsschlüssel (GitHub-Token)
        <input type="password" id="token" autocomplete="off" spellcheck="false">
      </label>
      <label class="a-check"><input type="checkbox" id="merken"> Auf diesem Gerät merken</label>
      <p class="a-hinweis">Den Schlüssel erhalten Sie von Ihrem Webbetreuer. Er erlaubt nur Änderungen an dieser Website.</p>
    </div>

    <div data-fuer="test">
      <p class="a-hinweis">Testmodus: Sie können alles ausprobieren – es wird aber nichts gespeichert.</p>
    </div>

    <button type="submit" class="btn">Anmelden</button>
    <p class="a-fehler" id="login-fehler" role="alert"></p>
  </form>
</section>

<!-- Editor -->
<div class="a-app" id="app" hidden>
  <nav class="a-nav" aria-label="Bereiche">
    <ul id="bereiche"></ul>
  </nav>
  <main class="a-main">
    <div class="a-kopf">
      <h1 id="titel"></h1>
      <a id="ansehen" target="_blank" rel="noopener">Seite ansehen ↗</a>
    </div>
    <form id="editor" novalidate></form>
    <div class="a-leiste">
      <button type="button" class="btn" id="speichern" disabled>Speichern</button>
      <button type="button" class="btn ghost" id="verwerfen" disabled>Änderungen verwerfen</button>
      <span id="ungespeichert" hidden>● Ungespeicherte Änderungen</span>
    </div>
  </main>
</div>

</body>
</html>
